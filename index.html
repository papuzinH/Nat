<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#dde2d1" />

    <!--
      Etiquetas estáticas de fallback para crawlers que no ejecutan JS
      (scrapers de redes sociales, bots básicos).
      react-helmet-async las sobreescribe en runtime con los valores por ruta.
    -->
    <title>Natalia Heller — Arte Original &amp; Tienda | Buenos Aires</title>
    <meta name="description" content="Arte original, prints, stickers y obras únicas desde Buenos Aires. Tienda online de arte y estudio de tatuajes." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://tatuajesnaty.com/" />

    <!-- Open Graph (fallback estático — home) -->
    <meta property="og:site_name" content="Natalia Heller" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Natalia Heller — Arte Original Buenos Aires" />
    <meta property="og:description" content="Tienda de arte original: prints, stickers, abanicos y más. Estudio de tatuajes en Buenos Aires." />
    <meta property="og:url" content="https://tatuajesnaty.com/" />
    <meta property="og:image" content="https://tatuajesnaty.com/og-image.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_AR" />

    <!-- Twitter / X (fallback estático) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@nataliaceller_art" />
    <meta name="twitter:title" content="Natalia Heller — Arte Original Buenos Aires" />
    <meta name="twitter:description" content="Tienda de arte original: prints, stickers, abanicos y más. Estudio de tatuajes en Buenos Aires." />
    <meta name="twitter:image" content="https://tatuajesnaty.com/og-image.webp" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/Logo.svg" />

    <!-- Google Fonts — preconnect + carga no bloqueante -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Nunito:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
